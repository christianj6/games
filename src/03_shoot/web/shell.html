<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shoot</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101014; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  .status { position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; color: #9aa0b0; font-family: sans-serif;
            font-size: 16px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<div class="status" id="status">Downloading…</div>
<script>
  var GAME_VERSION = 'STAMP';
  var statusElement = document.getElementById('status');
  var Module = {
    locateFile: function(p) { return p + '?v=' + GAME_VERSION; },
    preRun: [],
    postRun: [],
    print: function(){},
    printErr: function(text){ console.warn(text); },
    canvas: (function() {
      var canvas = document.getElementById('canvas');
      canvas.addEventListener('webglcontextlost', function(e){ e.preventDefault(); }, false);
      return canvas;
    })(),
    setStatus: function(text) {
      statusElement.style.display = text ? 'flex' : 'none';
      if (text) statusElement.textContent = text;
    }
  };
  Module.setStatus('Downloading…');
  window.onerror = function() { Module.setStatus('Error — see browser console'); };
</script>
{{{ SCRIPT }}}
</body>
</html>
