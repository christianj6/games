<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>games</title>
<style>
  :root { --bg: #101014; --card: #1a1a22; --text: #e8e8ee; --dim: #9aa0b0; --accent: #e0b040; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 48px 24px 8px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
  .list { max-width: 1100px; margin: 32px auto 60px; padding: 0 24px;
          display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; background: var(--card); border-radius: 12px; overflow: hidden;
         cursor: pointer; border: 1px solid #2a2a34; transition: transform .15s, border-color .15s; }
  .row:hover { transform: translateY(-2px); border-color: var(--accent); }
  .thumb { width: 220px; aspect-ratio: 16/9; flex: none; background-color: #22222c;
           background-size: 130%; background-position: center; background-repeat: no-repeat; }
  .thumb.placeholder { display: flex; align-items: center; justify-content: center;
                       color: #4a4a58; font-size: 42px; }
  .body { padding: 14px 18px 16px; flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; justify-content: space-between; }
  h2 { margin: 0; font-size: 18px; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge.playable { background: #2a3d1e; color: #9fd66a; }
  .badge.soon { background: #3a3244; color: #b9a0d8; }
  .desc { margin: 8px 0 0; color: var(--dim); font-size: 13.5px; line-height: 1.45; }

  /* Modal */
  .modal { display: none; position: fixed; inset: 0; z-index: 50;
           background: rgba(5, 5, 10, 0.85); }
  .modal.open { display: flex; align-items: center; justify-content: center; }
  .dialog { position: relative; width: min(1100px, 94vw); background: #16161c;
            border: 1px solid #2a2a34; border-radius: 14px; padding: 14px; }
  .dialog h3 { margin: 2px 4px 12px; font-size: 17px; display: inline-block; }
  .close { position: absolute; top: 10px; right: 12px; background: none; border: none;
           color: var(--dim); font-size: 26px; cursor: pointer; line-height: 1; }
  .close:hover { color: #fff; }
  .frame-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #101014;
                border-radius: 8px; overflow: hidden; }
  .frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%;
                       border: 0; }
  .hint { margin: 10px 4px 2px; color: var(--dim); font-size: 12.5px; }
  @media (max-width: 640px) {
    .row { flex-direction: column; }
    .thumb { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>games</h1>
</header>

<div class="list" id="list"></div>

<div class="modal" id="modal">
  <div class="dialog">
    <button class="close" id="closeBtn" title="Close">&times;</button>
    <h3 id="modalTitle"></h3>
    <div class="frame-wrap"><iframe id="gameFrame" allow="fullscreen"></iframe></div>
    <p class="hint" id="modalHint"></p>
  </div>
</div>

<script>
const games = [
  { id: "00_jump",     title: "Jump",
    desc: "Simple side-scrolling jumper. First steps with Raylib, C++ syntax and classes.",
    playable: true, web: "games/00_jump/index.html", img: "img/00_jump.png",
    hint: "SPACE to jump — dodge the blue obstacles; hit one and it's game over. Reload the page to restart." },
  { id: "01_collect",  title: "Collect",
    desc: "Top-down coin collector with a chasing enemy. Raylib and C++ fundamentals.",
    playable: true, web: "games/01_collect/index.html", img: "img/01_collect.png",
    hint: "WASD to move — collect coins, avoid the enemy." },
  { id: "02_hide",     title: "Hide",
    desc: "Top-down stealth — hide from a searching enemy. Working with pointers and better abstractions.",
    playable: true, web: "games/02_hide/index.html", img: "img/02_hide.png",
    hint: "WASD to move — dodge the patrolling enemies' vision cones. Get caught and it's over — ENTER to restart." },
  { id: "03_shoot",    title: "Shoot",
    desc: "First-person shooter with patrolling enemies. Refining game abstractions, switching to CMake.",
    playable: true, web: "games/03_shoot/index.html", img: "img/03_shoot.png",
    hint: "Click the game to capture the mouse. WASD/arrows to move, left-click to shoot — grab the blue ball first to get the weapon." },
  { id: "04_teleport", title: "Teleport",
    desc: "A larger world with a teleportation mechanic. Introduces vcpkg, shaders, meshes and lighting.",
    playable: true, web: "games/04_teleport/index.html", img: "img/04_teleport.png",
    hint: "Click the game to capture the mouse. WASD move, SPACE double-jump, RMB teleport, LMB kill enemies up close, ESC pause." },
  { id: "05_explore",  title: "Explore",
    desc: "Open-world stealth exploration: blink across a procedural pillar field, collect shards guarded by behaviour-tree enemies, and bring them home.",
    playable: true, web: "games/05_explore/index.html", img: "img/05_explore.png",
    hint: "Click the game to capture the mouse. RMB tap/hold = blink, Q = recall, F = anchor, ESC = pause." },
];

const list = document.getElementById("list");
const modal = document.getElementById("modal");
const frame = document.getElementById("gameFrame");
const modalTitle = document.getElementById("modalTitle");
const modalHint = document.getElementById("modalHint");

for (const g of games) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    ${g.img ? `<div class="thumb" style="background-image:url('${g.img}')" role="img" aria-label="${g.title}"></div>`
            : `<div class="thumb placeholder">&#9670;</div>`}
    <div class="body">
      <div class="title-row">
        <h2>${g.title}</h2>
        <span class="badge ${g.playable ? "playable" : "soon"}">${g.playable ? "Playable" : "Desktop only"}</span>
      </div>
      <p class="desc">${g.desc}</p>
    </div>`;
  row.addEventListener("click", () => openGame(g));
  list.appendChild(row);
}

function openGame(g) {
  modalTitle.textContent = g.title;
  if (g.playable) {
    modalHint.textContent = g.hint;
    frame.src = g.web;
  } else {
    modalHint.textContent = "This one runs as a desktop build only — port it to WebAssembly to play here.";
    frame.src = "about:blank";
  }
  modal.classList.add("open");
}

function closeModal() {
  modal.classList.remove("open");
  frame.src = "about:blank"; // stop the game loop when the modal closes
}

document.getElementById("closeBtn").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
</script>
</body>
</html>
