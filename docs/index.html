<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raylib Games</title>
<style>
  :root { --bg: #101014; --card: #1a1a22; --text: #e8e8ee; --dim: #9aa0b0; --accent: #e0b040; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 40px 24px 12px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 1px; }
  header p { margin: 0; color: var(--dim); }
  .grid { max-width: 1100px; margin: 24px auto 60px; padding: 0 24px;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer;
          border: 1px solid #2a2a34; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #22222c; }
  .thumb.placeholder { display: flex; align-items: center; justify-content: center;
                       color: #4a4a58; font-size: 42px; }
  .body { padding: 14px 16px 16px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; }
  h2 { margin: 0; font-size: 18px; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge.playable { background: #2a3d1e; color: #9fd66a; }
  .badge.soon { background: #3a3244; color: #b9a0d8; }
  .desc { margin: 8px 0 0; color: var(--dim); font-size: 13.5px; line-height: 1.45; }

  /* Modal */
  .modal { display: none; position: fixed; inset: 0; z-index: 50;
           background: rgba(5, 5, 10, 0.85); }
  .modal.open { display: flex; align-items: center; justify-content: center; }
  .dialog { position: relative; width: min(1100px, 94vw); background: #16161c;
            border: 1px solid #2a2a34; border-radius: 14px; padding: 14px; }
  .dialog h3 { margin: 2px 4px 12px; font-size: 17px; display: inline-block; }
  .close { position: absolute; top: 10px; right: 12px; background: none; border: none;
           color: var(--dim); font-size: 26px; cursor: pointer; line-height: 1; }
  .close:hover { color: #fff; }
  .frame-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #101014;
                border-radius: 8px; overflow: hidden; }
  .frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%;
                       border: 0; }
  .hint { margin: 10px 4px 2px; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>

<header>
  <h1>RAYLIB GAMES</h1>
  <p>A series of progressively more complex C++ games — the newest ones playable right in your browser.</p>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="dialog">
    <button class="close" id="closeBtn" title="Close">&times;</button>
    <h3 id="modalTitle"></h3>
    <div class="frame-wrap"><iframe id="gameFrame" allow="fullscreen"></iframe></div>
    <p class="hint" id="modalHint"></p>
  </div>
</div>

<script>
const games = [
  { id: "05_explore",  title: "05 — Explore",
    desc: "Open-world stealth exploration: blink across a procedural pillar field, collect shards guarded by behaviour-tree enemies, and bring them home.",
    playable: true, web: "games/05_explore/index.html", img: null,
    hint: "Click the game to capture the mouse. RMB tap/hold = blink, Q = recall, F = anchor, ESC = pause." },
  { id: "04_teleport", title: "04 — Teleport",
    desc: "A larger world with a teleportation mechanic. Introduces vcpkg, shaders, meshes and lighting.",
    playable: false, img: "img/04_teleport.png" },
  { id: "03_shoot",    title: "03 — Shoot",
    desc: "First-person shooter with patrolling enemies. Refining game abstractions, switching to CMake.",
    playable: false, img: "img/03_shoot.png" },
  { id: "02_hide",     title: "02 — Hide",
    desc: "Top-down stealth — hide from a searching enemy. Working with pointers and better abstractions.",
    playable: false, img: "img/02_hide.png" },
  { id: "01_collect",  title: "01 — Collect",
    desc: "Top-down coin collector with a chasing enemy. Raylib and C++ fundamentals.",
    playable: false, img: "img/01_collect.png" },
  { id: "00_jump",     title: "00 — Jump",
    desc: "Simple side-scrolling jumper. First steps with Raylib, C++ syntax and classes.",
    playable: false, img: "img/00_jump.png" },
];

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const frame = document.getElementById("gameFrame");
const modalTitle = document.getElementById("modalTitle");
const modalHint = document.getElementById("modalHint");

for (const g of games) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    ${g.img ? `<img class="thumb" src="${g.img}" alt="${g.title}">`
            : `<div class="thumb placeholder">&#9670;</div>`}
    <div class="body">
      <div class="title-row">
        <h2>${g.title}</h2>
        <span class="badge ${g.playable ? "playable" : "soon"}">${g.playable ? "Playable" : "Desktop only"}</span>
      </div>
      <p class="desc">${g.desc}</p>
    </div>`;
  card.addEventListener("click", () => openGame(g));
  grid.appendChild(card);
}

function openGame(g) {
  modalTitle.textContent = g.title;
  if (g.playable) {
    modalHint.textContent = g.hint;
    frame.src = g.web;
  } else {
    modalHint.textContent = "This one runs as a desktop build only — port it to WebAssembly to play here.";
    frame.src = "about:blank";
  }
  modal.classList.add("open");
}

function closeModal() {
  modal.classList.remove("open");
  frame.src = "about:blank"; // stop the game loop when the modal closes
}

document.getElementById("closeBtn").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
</script>
</body>
</html>
